kind = "web"
previewPath = "/"
title = "Goodwill Reporting"
description = "A synthetic-data reporting foundation linking report acquisition, trusted calculations and source-backed visibility for Goodwill Michiana."
version = "1.0.0"
id = "artifacts/goodwill"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25979

[services.development]
run = "pnpm --filter @workspace/goodwill run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/goodwill", "run", "build" ]
serve = "static"
publicDir = "artifacts/goodwill/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25979"
BASE_PATH = "/"
