openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 2.0.0
  description: Goodwill shared contract. Legacy v1 endpoints remain runnable; v2 endpoints are reserved for the parallel implementation lanes, not yet implemented.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /goodwill/v2/analytics/framework:
    get:
      operationId: getGoodwillAnalyticsFramework
      summary: Public sponsor KPI definitions only; contains no protected published values
      responses:
        "200":
          description: Original framework and scorecard definitions, all values null until authorized evaluation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AnalyticsKpi" }
  /goodwill/v2/analytics/query:
    post:
      operationId: queryGoodwillAnalytics
      summary: Original sponsor KPI framework evaluated at one immutable synthetic publication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsScope" }
      responses:
        "200":
          description: Complete KPI framework with measured values or explicit missing-input reasons; never sums overlapping sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsDashboard" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401":
          description: Existing explicitly approved operator required
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/analytics/superset-snapshot:
    post:
      operationId: exportGoodwillSupersetSnapshot
      summary: Export bounded source-local aggregates for the optional local Superset pilot
      description: Requires the same verified approved operator as Analytics. Returns aggregate metrics and metadata only; no accepted row evidence, raw intake, rejected rows, buyer identities, employee identities or credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoodwillSupersetSnapshotRequest" }
      responses:
        "200":
          description: One source, period and optional store scope pinned to exactly one immutable publication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodwillSupersetSnapshot" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { description: Existing explicitly approved operator required }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/experiments:
    get:
      operationId: getGoodwillExperiments
      summary: Authorized experiment review, recipe provenance and server-owned execution access
      description: Metadata only. Discovery permission is not inferred from a configured provider or a prior smoke call. No credentials, source URLs or client grants are exposed. Responses are Cache-Control no-store.
      responses:
        "200":
          description: Recipe summaries, explicit approved versions, repair count and current access gates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodwillExperimentReview" }
        "400": { $ref: "#/components/responses/ExperimentInvalidInput" }
        "401": { $ref: "#/components/responses/ExperimentUnauthorized" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
        "409": { $ref: "#/components/responses/ExperimentConflict" }
        "503": { $ref: "#/components/responses/ExperimentUnavailable" }
  /goodwill/v2/experiments/runs:
    post:
      operationId: startGoodwillExperimentRun
      summary: Queue a bounded Upright synthetic discovery or explicitly approved model-free replay
      description: Discovery requires separate server-owned execution/spending authorization and a fresh bounded reservation. Replay requires an existing approvalId and makes zero model calls. The server supplies all source URLs and grants; no batch is published by this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoodwillExperimentRunInput" }
      responses:
        "202":
          description: Experimental run queued in the existing acquisition worker; inspect /goodwill/v2/runs/{runId} for state and verified artifacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodwillExperimentIdentity" }
        "400": { $ref: "#/components/responses/ExperimentInvalidInput" }
        "401": { $ref: "#/components/responses/ExperimentUnauthorized" }
        "403": { $ref: "#/components/responses/ExperimentForbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
        "409": { $ref: "#/components/responses/ExperimentConflict" }
        "503": { $ref: "#/components/responses/ExperimentUnavailable" }
  /goodwill/v2/experiments/approvals:
    post:
      operationId: approveGoodwillExperimentRecipe
      summary: Process-owner approval of one exact recipe digest bound to an existing verified archived run
      description: Explicit confirmation and server-authorized process-owner review are mandatory. expectedDigest is canonical; digest is an existing compatibility alias. Exactly one digest field is accepted. Approval creates no acquisition run and publishes no financial data.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoodwillExperimentApprovalInput" }
      responses:
        "201":
          description: Immutable approval identity recorded for this exact recipe version and verified run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodwillExperimentIdentity" }
        "400": { $ref: "#/components/responses/ExperimentInvalidInput" }
        "401": { $ref: "#/components/responses/ExperimentUnauthorized" }
        "403": { $ref: "#/components/responses/ExperimentForbidden" }
        "404": { $ref: "#/components/responses/ExperimentNotFound" }
        "409": { $ref: "#/components/responses/ExperimentConflict" }
        "503": { $ref: "#/components/responses/ExperimentUnavailable" }
  /goodwill/v2/assistant/tools:
    get:
      operationId: getGoodwillAssistantTools
      summary: Discover the approved read-only reporting tools and their input contracts
      responses:
        "200":
          description: Machine-readable tool descriptors for existing authorized endpoints; no SQL or write tools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GoodwillReadOnlyToolDescriptor" }
        "401":
          description: Existing approved operator authorization required
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/assistant/query:
    post:
      operationId: askGoodwillAssistant
      summary: Model-free read-only routing to source-local reporting and publication-pinned evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoodwillAssistantInput" }
      responses:
        "200":
          description: Deterministic grounded answer, explicit refusal or unavailable data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodwillAssistantResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401":
          description: Existing approved operator authorization required
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/system/overview:
    get:
      operationId: getGoodwillSystemOverview
      summary: Actual PostgreSQL metadata table counts and nine business-source coverage
      responses:
        "200":
          description: Verified read-only database counts and repository source coverage; supporting datasets are not additional business sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodwillSystemOverview" }
        "401":
          description: Existing approved operator authorization required
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/access:
    get:
      operationId: getGoodwillOperatorAccess
      summary: Current verified session and explicit synthetic operator approval
      responses:
        "200":
          description: Current session approval state only; no financial or account identity data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodwillOperatorAccess" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/catalog:
    get:
      operationId: getGoodwillCatalog
      summary: All source datasets, definitions, stores and actual coverage
      responses:
        "200":
          description: Dataset and metric catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodwillCatalog" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/runs:
    get:
      operationId: listGoodwillRuns
      parameters:
        - { $ref: "#/components/parameters/Offset" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Run history newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcquisitionRunPage" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
    post:
      operationId: startGoodwillRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcquisitionRequest" }
      responses:
        "202":
          description: Queued bounded synthetic acquisition, not published metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcquisitionRun" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/runs/{runId}:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGoodwillRun
      responses:
        "200":
          description: Run state and verified file when available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcquisitionRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/runs/{runId}/cancel:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelGoodwillRun
      responses:
        "200":
          description: Cancelled run, or unchanged terminal run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcquisitionRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/runs/{runId}/download:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      operationId: downloadGoodwillRun
      responses:
        "200":
          description: Exact verified bytes, attachment filename and X-Content-SHA256 headers
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/uploads:
    post:
      operationId: requestGoodwillUpload
      summary: Request direct-to-object-storage upload; never accepts file bytes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "201":
          description: Expiring upload capability; do not log or persist uploadUrl
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "413": { $ref: "#/components/responses/ReportTooLarge" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/batches:
    get:
      operationId: listGoodwillBatches
      parameters:
        - { $ref: "#/components/parameters/Offset" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: sourceId, in: query, schema: { type: string } }
      responses:
        "200":
          description: All intake attempts, including rejected and duplicate attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchPage" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
    post:
      operationId: createGoodwillBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeRequest" }
      responses:
        "201":
          description: Recorded intake attempt; inspect state before displaying any publication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/ReportTooLarge" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/batches/{batchId}:
    parameters:
      - { name: batchId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGoodwillBatch
      responses:
        "200":
          description: Batch lineage, counts, reconciliation and correction references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/batches/{batchId}/rows:
    parameters:
      - { name: batchId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGoodwillBatchRows
      parameters:
        - { $ref: "#/components/parameters/Offset" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: disposition, in: query, schema: { type: string, enum: [accepted, rejected, duplicate] } }
      responses:
        "200":
          description: Original source row references and normalized values or rejection reasons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidencePage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/batches/{batchId}/review:
    parameters:
      - { name: batchId, in: path, required: true, schema: { type: string } }
    post:
      operationId: reviewGoodwillBatch
      summary: Explicit synthetic correction review with optimistic publication check
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionReview" }
      responses:
        "200":
          description: Reviewed correction; old raw bytes and publication history retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/metrics/query:
    post:
      operationId: queryGoodwillMetrics
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricQuery" }
      responses:
        "200":
          description: Published source-local metrics; unavailable is null, not zero
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricResult" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/evidence/query:
    post:
      operationId: queryGoodwillEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceQuery" }
      responses:
        "200":
          description: Contributing accepted records at an immutable publication version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidencePage" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/v2/exports:
    post:
      operationId: exportGoodwillReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "200":
          description: Spreadsheet-safe CSV from same immutable publication and query
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsvExport" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /goodwill/report:
    post:
      operationId: generateGoodwillReport
      summary: Filter the existing synthetic Upright fixture into a downloadable report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPeriod"
      responses:
        "200":
          description: Synthetic report bytes and identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyntheticReport"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "413":
          $ref: "#/components/responses/ReportTooLarge"
  /goodwill/imports:
    post:
      operationId: importGoodwillReport
      summary: Validate the exact downloaded CSV and publish a supervised foundation result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyntheticReport"
      responses:
        "200":
          description: Published result or replay of an identical import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingResult"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "413":
          $ref: "#/components/responses/ReportTooLarge"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /goodwill/latest:
    get:
      operationId: getGoodwillLatest
      summary: Last successfully published foundation result
      responses:
        "200":
          description: Current state; null until the first successful import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingState"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /goodwill/sources:
    get:
      operationId: getGoodwillSources
      summary: Nine source workflows and honest demo availability
      responses:
        "200":
          description: Source register
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportSource"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
  responses:
    ExperimentInvalidInput:
      description: Invalid frozen request fields, period, recipe identity/digest, explicit confirmation, policy gates or verified-run binding; nothing is published
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoodwillExperimentError" }
    ExperimentUnauthorized:
      description: Approved operator sign-in required; persona labels do not authorize access
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoodwillExperimentError" }
    ExperimentForbidden:
      description: Separate execution/spending authorization or explicit process-owner review authority is missing
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoodwillExperimentError" }
    ExperimentNotFound:
      description: Recipe/approval metadata or the required verified acquisition run was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoodwillExperimentError" }
    ExperimentConflict:
      description: Recipe provenance or local synthetic source is unavailable, or the acquisition worker is busy
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoodwillExperimentError" }
    ExperimentUnavailable:
      description: Experiment metadata, initialization or authorization service is unavailable; no data has been published
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoodwillExperimentError" }
    NotFound:
      description: Unknown resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReportingError" }
    Conflict:
      description: State, overlap, correction or concurrency conflict; last-good remains unchanged
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReportingError" }
    ReportTooLarge:
      description: Report exceeds the supervised foundation size limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReportingError"
    StorageUnavailable:
      description: Storage failed; last successful publication has not been replaced
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReportingError"
    InvalidInput:
      description: Invalid request; last successful publication is unchanged
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReportingError"
  schemas:
    AnalyticsScope:
      type: object
      additionalProperties: false
      required: [sourceId, period]
      properties:
        sourceId: { type: string, enum: [cash_monkey, upright, jewelry, shipping, fedex, shopgoodwill, goodwill_books, ebay, amazon] }
        period: { $ref: "#/components/schemas/ReportPeriod" }
        storeId: { type: string }
        snapshotAt: { type: string, format: date-time }
    GoodwillSupersetSnapshotRequest:
      type: object
      additionalProperties: false
      required: [sourceId, period]
      properties:
        sourceId: { type: string, enum: [cash_monkey, upright, jewelry, shipping, fedex, shopgoodwill, goodwill_books, ebay, amazon] }
        period: { $ref: "#/components/schemas/ReportPeriod" }
        storeId: { type: string, pattern: '^(GW-[0-9]{3}|__unknown__)$', description: Omit for all stores; __unknown__ selects unresolved attribution }
    GoodwillSupersetSnapshotPoint:
      type: object
      additionalProperties: false
      required: [key, value, contributingRows, missingBuyerRows]
      properties:
        key: { type: string, maxLength: 80 }
        value: { type: ["integer", "null"], minimum: -9007199254740991, maximum: 9007199254740991 }
        contributingRows: { type: integer, minimum: 0, maximum: 20000 }
        missingBuyerRows: { type: integer, minimum: 0, maximum: 20000 }
    GoodwillSupersetMetric:
      type: object
      additionalProperties: false
      required: [metricId, label, unit, definitionVersion, formula, grain, timeBasis, availabilityReason, status, value, points, coverage, warnings]
      properties:
        metricId: { type: string, enum: [net_item_sales, source_net, shipping_expense, daily_customers] }
        label: { type: string, maxLength: 100 }
        unit: { type: string, enum: [usd_cent, count] }
        definitionVersion: { type: string, maxLength: 80 }
        formula: { type: string, maxLength: 500 }
        grain: { type: string, maxLength: 200 }
        timeBasis: { type: string, maxLength: 200 }
        availabilityReason: { type: ["string", "null"], maxLength: 500 }
        status: { type: string, enum: [available, partial, unavailable] }
        value: { type: ["integer", "null"], minimum: -9007199254740991, maximum: 9007199254740991 }
        points: { type: array, maxItems: 366, items: { $ref: "#/components/schemas/GoodwillSupersetSnapshotPoint" } }
        coverage: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/SourceCoverage" } }
        warnings: { type: array, maxItems: 30, items: { type: string, maxLength: 300 } }
    GoodwillSupersetSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, synthetic, snapshotId, checksum, scopeId, exportedAt, snapshotAgeSeconds, sourceId, period, storeId, publicationId, publishedAt, timezone, currency, metrics, warnings]
      properties:
        schemaVersion: { type: string, enum: ["goodwill-superset/1.0.0"] }
        synthetic: { type: boolean, enum: [true] }
        snapshotId: { type: string, pattern: '^[a-f0-9]{64}$' }
        checksum: { type: string, pattern: '^[a-f0-9]{64}$', description: Corruption check only; not proof of authenticity or completeness }
        scopeId: { type: string, pattern: '^[a-f0-9]{64}$', description: Stable identity for the exact source/date/store query scope }
        exportedAt: { type: string, format: date-time }
        snapshotAgeSeconds: { type: integer, minimum: 0, maximum: 9007199254740991 }
        sourceId: { type: string, enum: [cash_monkey, upright, jewelry, shipping, fedex, shopgoodwill, goodwill_books, ebay, amazon] }
        period: { $ref: "#/components/schemas/ReportPeriod" }
        storeId: { type: ["string", "null"], pattern: '^(GW-[0-9]{3}|__unknown__)$' }
        publicationId: { type: string, minLength: 1, maxLength: 120 }
        publishedAt: { type: string, format: date-time }
        timezone: { type: string, enum: [America/New_York] }
        currency: { type: string, enum: [USD] }
        metrics: { type: array, minItems: 1, maxItems: 4, items: { $ref: "#/components/schemas/GoodwillSupersetMetric" } }
        warnings: { type: array, maxItems: 30, items: { type: string, maxLength: 300 } }
    AnalyticsPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: ["number", "null"] }
    AnalyticsKpi:
      type: object
      required: [id, label, area, unit, value, status, reason, formula, requiredInputs, points, coo, plan2027]
      properties:
        id: { type: string }
        label: { type: string }
        area: { type: string, enum: [financial, production, sales, category, customer, inventory] }
        unit: { type: string, enum: [usd_cent, count, percent, days, rating] }
        value: { type: ["number", "null"] }
        status: { type: string, enum: [available, partial, unavailable] }
        reason: { type: string }
        formula: { type: string }
        requiredInputs: { type: array, items: { type: string } }
